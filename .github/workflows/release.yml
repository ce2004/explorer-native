name: release

# Push a tag like v1.0.1 to build both architectures and publish a release.
# Help, Check for updates in the app reads the latest release from here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'
          if ($v -notmatch '^v\d+\.\d+\.\d+$') { $v = 'v0.0.0' }
          "version=$($v.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'arm64', 'x64') {
            dotnet publish ExplorerNative.csproj -c Release -r "win-$arch" -o "out/$arch" `
              -p:Version=${{ steps.ver.outputs.version }}
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Copy-Item "out/$arch/ExplorerNative.exe" "dist/ExplorerNative-$arch.exe"
            # The gzip copy Check for updates downloads: about 40 percent of the size.
            $in = [IO.File]::OpenRead("dist/ExplorerNative-$arch.exe")
            $out = [IO.File]::Create("dist/ExplorerNative-$arch.exe.gz")
            $gz = [IO.Compression.GZipStream]::new($out, [IO.Compression.CompressionLevel]::SmallestSize)
            $in.CopyTo($gz); $gz.Dispose(); $in.Dispose()
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerNative
          path: dist/*

      # This version's lines from CHANGES.txt: plain text, one change per line.
      # No Markdown: the update dialog lists each line, and NVDA reads symbols.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 == v { f = 1; next }
            /^[0-9]+[.][0-9]+[.][0-9]+$/ { f = 0 }
            f && NF' CHANGES.txt > notes.txt
          [ -s notes.txt ] || { echo "CHANGES.txt has no section for this version"; exit 1; }
          cat notes.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' dist/ExplorerNative-arm64.exe dist/ExplorerNative-x64.exe dist/ExplorerNative-arm64.exe.gz dist/ExplorerNative-x64.exe.gz --title "Explorer Native ${{ steps.ver.outputs.version }}" --notes-file notes.txt

      # After the release, so updates are out without waiting for it.
      # Runs natively on x64. Informational: some sections need audio hardware
      # or a desktop session the runner does not have.
      - name: Self-test (x64)
        continue-on-error: true
        shell: pwsh
        run: dotnet run --project tests/SelfTest.csproj -c Release -r win-x64
